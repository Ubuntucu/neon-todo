name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java (JDK 17) Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Bağımlılıkları Yükle
        run: npm install

      - name: Capacitor Android Projesini Oluştur
        run: |
          npx cap init "Yapilacaklar" "com.neontodo.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Android Projesini Derle (APK Oluştur)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK Dosyasını Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
